name: Isolated music link correction safety QA
on:
  push:
    branches: [qa-music-link-correction-20261124]
    paths: ['backend/SyncOpps_MusicLinkCorrections_v1.0.gs','backend/tests/test_music_link_corrections.js','.github/workflows/music-link-correction-qa.yml']
permissions:
  contents: read
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node backend/tests/test_music_link_corrections.js
