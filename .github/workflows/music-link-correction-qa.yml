name: Isolated music link correction safety QA
on:
  push:
    branches: [qa-music-link-correction-20261124]
    paths: ['backend/SyncOpps_MusicLinkCorrections_v1.0.gs','backend/SyncOpps_Beta_Buyer_Intake_v1.1.gs','backend/tests/test_music_link_corrections.js','.github/workflows/music-link-correction-qa.yml']
permissions:
  contents: read
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node backend/tests/test_music_link_corrections.js
      - name: Validate actual combined production candidate
        run: |
          node -e "const fs=require('fs'),vm=require('vm');new vm.Script(fs.readFileSync('backend/SyncOpps_Beta_Buyer_Intake_v1.1.gs','utf8'));console.log('Combined source syntax PASS')"
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm');
          const code=fs.readFileSync('backend/SyncOpps_Beta_Buyer_Intake_v1.1.gs','utf8');
          const module=fs.readFileSync('backend/SyncOpps_MusicLinkCorrections_v1.0.gs','utf8');
          assert.ok(code.includes(module),'Tested correction module unchanged');
          const c=vm.createContext({console,PropertiesService:{getScriptProperties:()=>({getProperty:()=>null})}});vm.runInContext(code,c);
          vm.runInContext("soBBProcessOriginalV11_=()=>({acceptedBeta:0,buyerSent:0});",c);
          const r=vm.runInContext("syncOppsProcessBetaBuyer({triggerUid:'qa'})",c);assert.equal(r.linkCorrections.status,'DISABLED');
          vm.runInContext("soBBProcessOriginalV11_=()=>({status:'SKIPPED_BUSY'});soLCOnExistingTrigger_=()=>{throw Error('must not run')};",c);
          assert.equal(vm.runInContext("syncOppsProcessBetaBuyer({triggerUid:'qa'})",c).status,'SKIPPED_BUSY');
          vm.runInContext("soBBProcessOriginalV11_=()=>({buyerSent:1});",c);const failed=vm.runInContext("syncOppsProcessBetaBuyer({triggerUid:'qa'})",c);assert.equal(failed.buyerSent,1);assert.equal(failed.linkCorrections.status,'ERROR');
          console.log('PASS: exact tested module, disabled default, original trigger busy handling, correction error isolation');
          NODE
  published-form-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published correction form using synthetic non-authorized request
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node <<'NODE'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage();
              const u=new URL('https://tally.so/r/KpVK1K');
              const p={request_token:'QA-NOT-A-VALID-TOKEN',song_id:'QA-NOT-A-REAL-SONG',song_title:'Synthetic Correction QA',issue:'Synthetic test only, not a real music issue'};
              for(const [k,v] of Object.entries(p))u.searchParams.set(k,v);
              await page.goto(u.href,{waitUntil:'domcontentloaded',timeout:30000});
              await page.getByText('Synthetic Correction QA',{exact:false}).first().waitFor({timeout:20000});
              await page.getByText('Synthetic test only, not a real music issue',{exact:false}).first().waitFor({timeout:20000});
              await page.getByPlaceholder('Email associated with your membership').fill('qa@example.com');
              const iframe=page.frameLocator('iframe[src*="tools/music-link-tester.html"]');
              await iframe.locator('#source').waitFor({timeout:20000});
              await iframe.locator('#source').fill('https://soundcloud.com/forss/flickermood');
              await iframe.locator('#test').click();
              await iframe.locator('#copy').waitFor({timeout:10000});
              await iframe.locator('#copy').click();
              const input=page.getByPlaceholder('https://...',{exact:true});
              await input.click();await page.keyboard.press('Control+v');
              assert.equal(await input.inputValue(),'https://soundcloud.com/forss/flickermood');
              // No submit; validate form UI and clipboard without any new intake record.
              console.log(JSON.stringify({qaCorrectionForm:'published',songTitlePrefill:true,issuePrefill:true,embeddedTester:true,clipboardPaste:true,noSubmission:true}));
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
