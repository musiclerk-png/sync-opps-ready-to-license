name: Isolated Tally music URL transfer QA
on:
  push:
    branches: [qa-feed-timing-20261124]
    paths: ['.github/workflows/catalog-safety.yml']
permissions:
  contents: read
jobs:
  test-free-embed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check answer piping versus dynamic iframe URL without submitting
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage();
              await page.goto('https://tally.so/r/kbN8jZ',{waitUntil:'domcontentloaded',timeout:30000});
              const input=page.locator('input').filter({visible:true}).first();
              await input.waitFor({state:'visible',timeout:20000});
              const inspect=async()=>{
                return await page.evaluate(()=>{
                  const frames=Array.from(document.querySelectorAll('iframe')).map(f=>({src:f.getAttribute('src')||'',visible:!!f.getClientRects().length})).filter(x=>x.src.includes('catalog-player.html'));
                  return {frames,controlText:document.body.innerText.includes('Answer piping control:')};
                });
              };
              const initial=await inspect();
              for(const value of ['https://example.com/qa-song-one','https://example.com/qa-song-two']){
                await input.fill(value);
                await input.press('Tab');
                await page.waitForTimeout(1500);
                const current=await inspect();
                const control=await page.locator('body').innerText();
                console.log(JSON.stringify({qaValue:value,initial,current,textPipingWorks:control.includes(value),embedReceivesValue:current.frames.some(f=>{try{return new URL(f.src).searchParams.get('qa_source')===value;}catch{return false;}})}));
              }
              console.log('QA completed; no submit action performed.');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
