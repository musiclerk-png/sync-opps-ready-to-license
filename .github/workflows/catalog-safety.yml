name: Catalog safety regression

on:
  push:
    paths:
      - 'backend/**'
      - 'index.html'
      - '.github/workflows/catalog-safety.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'index.html'
      - '.github/workflows/catalog-safety.yml'

permissions:
  contents: read

jobs:
  no-live-data-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser catalog JavaScript syntax
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const a=h.indexOf('<script>');const b=h.indexOf('</script>',a+8);if(a<0||b<0)throw Error('Site script missing');new Function(h.slice(a+8,b));"
      - name: Run synthetic managed MP3 rights and host guards
        run: node backend/tests/test_live_baseline_managed_mp3.js
      - name: Run synthetic buyer routing and idempotency tests
        run: node backend/tests/test_buyer_intake_delivery_simulated.js
      - name: Test Tally API timeouts, retries and fail-closed polling
        run: node backend/tests/test_tally_fetch_retry.js
      - name: Test buyer-facing catalog design and secure inquiries
        run: node backend/tests/test_buyer_homepage.js
      - name: Test scheduled intake lock contention and server failures
        run: node backend/tests/test_intake_lock_overlap.js

      - name: Read-only production feed timing sample
        run: |
          node <<'NODE'
          const {performance}=require('node:perf_hooks');
          const fs=require('node:fs');
          const config=JSON.parse(fs.readFileSync('feed-config.json','utf8'));
          const endpoint=config.endpoint;
          if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint)) throw Error('Unexpected endpoint');
          (async()=>{
            for(let i=1;i<=3;i++){
              const url=new URL(endpoint);
              url.searchParams.set('benchmark','1');
              url.searchParams.set('probe',Date.now()+'-'+i);
              const start=performance.now();
              try{
                const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(25000),redirect:'follow'});
                const headersMs=Math.round(performance.now()-start);
                const raw=await response.text();
                const totalMs=Math.round(performance.now()-start);
                const match=raw.trim().match(/^window\.syncOppsApprovedFeedV1\((\{[\s\S]*\})\);?$/);
                if(!response.ok || !match) throw Error('Unexpected public response: HTTP '+response.status);
                const data=JSON.parse(match[1]),d=data.readDiagnostics;
                if(data.schemaVersion!==1 || !Array.isArray(data.songs) || !d || !Number.isFinite(d.serverMs)) throw Error('Invalid benchmark schema');
                console.log(JSON.stringify({sample:i,http:response.status,headersMs,totalMs,serverMs:d.serverMs,path:d.path,fallbackReason:d.fallbackReason,stages:d.stages??null,approvedCount:data.songs.length,expectedTrack:data.songs.some(s=>s.title==='Soul Pocket Groove'),privateContactPattern:/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/.test(raw)}));
              }catch(e){console.log(JSON.stringify({sample:i,error:String(e.message),elapsedMs:Math.round(performance.now()-start)}));}
            }
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE

      - name: Measure actual signed-out browser card rendering
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(let i=1;i<=3;i++){
                const context=await browser.newContext();
                try{
                  const page=await context.newPage();
                  await page.goto('https://musiclerk-png.github.io/sync-opps-ready-to-license/',{waitUntil:'domcontentloaded',timeout:25000});
                  await page.locator('.song-card').filter({hasText:'Soul Pocket Groove'}).first().waitFor({state:'visible',timeout:15000});
                  const metrics=await page.evaluate(()=>{
                    const nav=performance.getEntriesByType('navigation')[0];
                    const config=performance.getEntriesByType('resource').find(e=>e.name.includes('/feed-config.json'));
                    const feed=performance.getEntriesByType('resource').find(e=>e.name.startsWith('https://script.google.com/macros/s/'));
                    const card=document.querySelector('.song-card');
                    return {cardMs:Math.round(performance.now()),domReadyMs:Math.round(nav?.domContentLoadedEventEnd||0),configMs:config?Math.round(config.duration):null,feedStartMs:feed?Math.round(feed.startTime):null,feedMs:feed?Math.round(feed.duration):null,afterFeedMs:feed?Math.max(0,Math.round(performance.now()-feed.responseEnd)):null,cardCount:document.querySelectorAll('.song-card').length,mp3Preload:card?.querySelector('audio')?.preload??null};
                  });
                  console.log(JSON.stringify({browserSample:i,...metrics}));
                }catch(e){console.log(JSON.stringify({browserSample:i,error:String(e.message).slice(0,250)}));}
                finally{await context.close();}
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
