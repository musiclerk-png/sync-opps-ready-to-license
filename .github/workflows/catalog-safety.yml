name: Isolated real media and layout QA
on:
  push:
    branches: [qa-feed-timing-20261124]
    paths: ['.github/workflows/catalog-safety.yml']
permissions:
  contents: read
jobs:
  real-media:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real approved MP3 and official SoundCloud sample within Tally QA form
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node <<'NODE'
          const {chromium}=require('playwright'),fs=require('node:fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('qa/optional-link-tester-isolated.html','utf8');
          const qa='https://tally.so/r/kbN8jZ';
          const homepage='https://musiclerk-png.github.io/sync-opps-ready-to-license/';
          const sample='https://soundcloud.com/forss/flickermood';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const publicPage=await browser.newPage();
              await publicPage.goto(homepage,{waitUntil:'domcontentloaded',timeout:30000});
              const card=publicPage.locator('.song-card').filter({hasText:'Soul Pocket Groove'});
              await card.waitFor({state:'visible',timeout:20000});
              assert.equal(await publicPage.locator('.song-card').count(),1);
              const url=await card.locator('audio').getAttribute('src');
              assert.match(url,/^https:\/\/res\.cloudinary\.com\/[A-Za-z0-9_-]+\/video\/upload\/v\d+\/sync_opps_catalog_previews\/preview_[a-f0-9]{32}\.mp3$/i);
              await publicPage.close();
              for(const mobile of [false,true]){
                const context=await browser.newContext({viewport:mobile?{width:390,height:844}:{width:1280,height:900},isMobile:mobile,hasTouch:mobile});
                await context.route('**/qa/catalog-player.html?qa_control=static',route=>route.fulfill({status:200,contentType:'text/html',body:html}));
                const page=await context.newPage();
                await page.goto(qa,{waitUntil:'domcontentloaded',timeout:30000});
                const input=page.locator('input').filter({visible:true}).first();
                await input.waitFor({state:'visible',timeout:20000});
                const outer=page.locator('iframe[src*="qa_control=static"]'),frame=page.frameLocator('iframe[src*="qa_control=static"]');
                await frame.locator('#source').waitFor({state:'visible',timeout:20000});
                const original=page.url();
                await frame.locator('#source').fill(url);
                await frame.locator('#test').click();
                const audio=frame.locator('audio');
                await audio.evaluate(a=>{a.play().catch(()=>{});});
                await frame.locator('#status').filter({hasText:'Audio playback started'}).waitFor({timeout:20000});
                await page.waitForTimeout(1200);
                const media=await audio.evaluate(a=>({duration:a.duration,currentTime:a.currentTime,paused:a.paused,readyState:a.readyState}));
                assert.ok(media.duration>50&&media.currentTime>0.2&&!media.paused,'Actual approved media must advance');
                await audio.evaluate(a=>a.pause());
                await frame.locator('#copy').click();
                const copyStatus=await frame.locator('#copyStatus').innerText();
                if(!copyStatus.startsWith('Copied'))await frame.locator('#copyValue').press('Control+c');
                await input.click();await page.keyboard.press('Control+v');
                assert.equal(await input.inputValue(),url);
                const layout=await frame.locator('body').evaluate(()=>({innerWidth,innerHeight,scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight}));
                assert.ok(layout.scrollWidth<=layout.innerWidth+2,'Horizontal overflow');
                assert.equal(page.url(),original);
                console.log(JSON.stringify({qaReal:mobile?'mobile viewport':'desktop',approvedMP3:true,media,actualClipboardPaste:true,layout,stayedOnForm:true,noSubmission:true}));
                await frame.locator('#source').fill(sample);
                await frame.locator('#test').click();
                const scframe=frame.locator('#player iframe');
                await scframe.waitFor({state:'visible',timeout:10000});
                // Use the provider's official Widget API for read-only playback evidence.
                // No mocked provider, no audio recording or downloading.
                const sf=await outer.elementHandle();const widgetHost=await sf.contentFrame();
                let evidence={ready:false,playing:false,progressMs:0,error:false};
                try{
                  await widgetHost.addScriptTag({url:'https://w.soundcloud.com/player/api.js'});
                  await widgetHost.evaluate(()=>{
                    window.qaSC={ready:false,playing:false,progressMs:0,error:false};
                    const w=window.SC.Widget(document.querySelector('#player iframe'));
                    window.qaWidget=w;
                    w.bind(window.SC.Widget.Events.READY,()=>{window.qaSC.ready=true;});
                    w.bind(window.SC.Widget.Events.PLAY,()=>{window.qaSC.playing=true;});
                    w.bind(window.SC.Widget.Events.PLAY_PROGRESS,p=>{window.qaSC.progressMs=Math.max(window.qaSC.progressMs,p.currentPosition||0);});
                    w.bind(window.SC.Widget.Events.ERROR,()=>{window.qaSC.error=true;});
                    w.getDuration(d=>{if(d>0)window.qaSC.ready=true;});
                  });
                  await widgetHost.waitForFunction(()=>window.qaSC.ready||window.qaSC.error,{},{timeout:20000});
                  // Initiate playback via a deliberate click on a QA-only control within the iframe.
                  await widgetHost.evaluate(()=>{const b=document.createElement('button');b.id='qa-sc-play';b.textContent='QA playback';b.onclick=()=>window.qaWidget.play();document.body.append(b);});
                  await widgetHost.locator('#qa-sc-play').click();
                  await widgetHost.waitForFunction(()=>window.qaSC.progressMs>500||window.qaSC.error,{},{timeout:20000});
                  evidence=await widgetHost.evaluate(()=>window.qaSC);
                }catch(e){evidence=await widgetHost.evaluate(()=>window.qaSC||{ready:false,playing:false,progressMs:0,error:false}).catch(()=>evidence);evidence.blocker=String(e.message).split('\n')[0].slice(0,180);}
                await widgetHost.evaluate(()=>window.qaWidget?.pause()).catch(()=>{});
                console.log(JSON.stringify({qaProvider:mobile?'mobile viewport':'desktop',provider:'SoundCloud official documented sample',...evidence,formatOnly:!(evidence.playing&&evidence.progressMs>500),stayedOnForm:page.url()===original}));
                await context.close();
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
