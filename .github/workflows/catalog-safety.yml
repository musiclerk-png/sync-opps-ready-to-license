name: Catalog safety regression

on:
  push:
    paths:
      - 'backend/**'
      - 'index.html'
      - '.github/workflows/catalog-safety.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'index.html'
      - '.github/workflows/catalog-safety.yml'

permissions:
  contents: read

jobs:
  no-live-data-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser catalog JavaScript syntax
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const a=h.indexOf('<script>');const b=h.indexOf('</script>',a+8);if(a<0||b<0)throw Error('Site script missing');new Function(h.slice(a+8,b));"
      - name: Run synthetic managed MP3 rights and host guards
        run: node backend/tests/test_live_baseline_managed_mp3.js
      - name: Run synthetic buyer routing and idempotency tests
        run: node backend/tests/test_buyer_intake_delivery_simulated.js
      - name: Test Tally API timeouts, retries and fail-closed polling
        run: node backend/tests/test_tally_fetch_retry.js
      - name: Test buyer-facing catalog design and secure inquiries
        run: node backend/tests/test_buyer_homepage.js
      - name: Test scheduled intake lock contention and server failures
        run: node backend/tests/test_intake_lock_overlap.js

      - name: Six matched advanced Sheets comparisons
        run: |
          node <<'NODE'
          const {performance}=require('node:perf_hooks');
          const {endpoint}=JSON.parse(require('node:fs').readFileSync('feed-config.json','utf8'));
          if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint))throw Error('Invalid endpoint');
          const median=a=>{const b=[...a].sort((x,y)=>x-y);return (b[2]+b[3])/2;};
          (async()=>{
            const samples=[];
            for(let i=1;i<=6;i++){
              const url=new URL(endpoint);
              url.searchParams.set('benchmark','1');
              url.searchParams.set('compare','advanced');
              url.searchParams.set('probe',Date.now()+'-'+i);
              const start=performance.now();
              const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(25000),redirect:'follow'});
              const raw=await response.text();
              const elapsedMs=Math.round(performance.now()-start);
              const match=raw.trim().match(/^window\.syncOppsApprovedFeedV1\((\{[\s\S]*\})\);?$/);
              if(!response.ok||!match)throw Error('Public feed response invalid: HTTP '+response.status);
              const data=JSON.parse(match[1]),d=data.readDiagnostics,c=d?.advancedComparison;
              const sample={sample:i,http:response.status,elapsedMs,legacyMs:d?.serverMs,advancedMs:c?.serverMs,status:c?.status??'MISSING',reason:c?.reason??null,parity:c?.parity===true,legacyPath:d?.path,legacyTablesMs:d?.stages?.tablesMs,advancedTablesMs:c?.stages?.tablesMs,approvedCount:data.songs?.length,expectedTrack:data.songs?.some(s=>s.title==='Soul Pocket Groove'),privateContactPattern:/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/.test(raw)};
              console.log(JSON.stringify(sample));
              if(data.schemaVersion!==1||!Array.isArray(data.songs)||sample.approvedCount!==1||!sample.expectedTrack||sample.privateContactPattern||sample.legacyPath!=='legacy'||sample.status!=='OK'||!sample.parity||!Number.isFinite(sample.legacyMs)||!Number.isFinite(sample.advancedMs))throw Error('Comparison acceptance failed; stop without changing normal reader');
              samples.push(sample);
            }
            const legacyMedianMs=median(samples.map(s=>s.legacyMs)),advancedMedianMs=median(samples.map(s=>s.advancedMs)),savingMs=legacyMedianMs-advancedMedianMs,savingPct=100*savingMs/legacyMedianMs;
            const pairedMedianSavingMs=median(samples.map(s=>s.legacyMs-s.advancedMs));
            console.log(JSON.stringify({summary:true,valid:samples.length,legacyMedianMs,advancedMedianMs,savingMs,savingPct,pairedMedianSavingMs,passes:savingMs>=750&&savingPct>=25&&pairedMedianSavingMs>=750}));
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
