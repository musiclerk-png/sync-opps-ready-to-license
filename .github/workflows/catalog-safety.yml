name: Published optional tester smoke QA
on:
  push:
    branches: [qa-feed-timing-20261124]
    paths: ['.github/workflows/catalog-safety.yml']
permissions:
  contents: read
jobs:
  real-media:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real approved MP3 and official SoundCloud sample within Tally QA form
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node <<'NODE'
          const {chromium}=require('playwright'),fs=require('node:fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('qa/optional-link-tester-isolated.html','utf8');
          const qa='https://tally.so/r/peo0gV';
          const homepage='https://musiclerk-png.github.io/sync-opps-ready-to-license/';
          const sample='https://soundcloud.com/forss/flickermood';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const publicPage=await browser.newPage();
              await publicPage.goto(homepage,{waitUntil:'domcontentloaded',timeout:30000});
              const card=publicPage.locator('.song-card').filter({hasText:'Soul Pocket Groove'});
              await card.waitFor({state:'visible',timeout:20000});
              assert.equal(await publicPage.locator('.song-card').count(),1);
              const url=await card.locator('audio').getAttribute('src');
              assert.match(url,/^https:\/\/res\.cloudinary\.com\/[A-Za-z0-9_-]+\/video\/upload\/v\d+\/sync_opps_catalog_previews\/preview_[a-f0-9]{32}\.mp3$/i);
              await publicPage.close();
              for(const mobile of [false,true]){
                const context=await browser.newContext({viewport:mobile?{width:390,height:844}:{width:1280,height:900},isMobile:mobile,hasTouch:mobile});
                // No response interception: published form and component.
                const page=await context.newPage();
                await page.goto(qa,{waitUntil:'domcontentloaded',timeout:30000});
                await page.getByPlaceholder('Name shown in catalog').fill('QA browser test');
                await page.getByPlaceholder('Email associated with your paid Patreon membership').fill('qa@example.com');
                await page.getByPlaceholder('Name buyers should address').fill('QA browser test');
                await page.getByPlaceholder('Email where licensing inquiries should be routed').fill('qa@example.com');
                // Only advance from first page; never submit the final form.
                const next=page.getByRole('button',{name:/next|continue/i}).first();
                await next.click();
                await page.getByText('Song 1: Streaming Platform',{exact:true}).waitFor({state:'visible',timeout:20000});
                const input=page.getByPlaceholder('https://...',{exact:true}).filter({visible:true}).first();
                const outer=page.locator('iframe[src*="tools/music-link-tester.html"]').filter({visible:true}).first();
                await outer.waitFor({state:'visible',timeout:20000});
                const frame=outer.contentFrame();
                await frame.locator('#source').waitFor({state:'visible',timeout:20000});
                const original=page.url();
                const initial=await frame.locator('body').evaluate(()=>({w:innerWidth,h:innerHeight,scrollH:document.documentElement.scrollHeight,buttonBottom:document.querySelector('#test').getBoundingClientRect().bottom}));
                assert.ok(initial.buttonBottom<=initial.h,'Initial test button clipped');
                await frame.locator('#source').fill(url);
                await frame.locator('#test').click();
                const audio=frame.locator('audio');
                await audio.evaluate(a=>{a.play().catch(()=>{});});
                await frame.locator('#status').filter({hasText:'Audio playback started'}).waitFor({timeout:20000});
                await page.waitForTimeout(1200);
                const media=await audio.evaluate(a=>({duration:a.duration,currentTime:a.currentTime,paused:a.paused,readyState:a.readyState}));
                assert.ok(media.duration>50&&media.currentTime>0.2&&!media.paused,'Actual approved media must advance');
                await audio.evaluate(a=>a.pause());
                await frame.locator('#copy').click();
                const copyStatus=await frame.locator('#copyStatus').innerText();
                if(!copyStatus.startsWith('Copied'))await frame.locator('#copyValue').press('Control+c');
                await input.click();await page.keyboard.press('Control+v');
                assert.equal(await input.inputValue(),url);
                const layout=await frame.locator('body').evaluate(()=>({innerWidth,innerHeight,scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight,copyBottom:document.querySelector('#copy').getBoundingClientRect().bottom,playerBottom:document.querySelector('audio').getBoundingClientRect().bottom}));
                assert.ok(layout.copyBottom<=layout.innerHeight&&layout.playerBottom<=layout.innerHeight,'MP3 or copy control clipped');
                assert.ok(layout.scrollWidth<=layout.innerWidth+2,'Horizontal overflow');
                assert.equal(page.url(),original);
                console.log(JSON.stringify({qaReal:mobile?'mobile viewport':'desktop',approvedMP3:true,media,actualClipboardPaste:true,initial,layout,stayedOnForm:true,noSubmission:true}));
                await frame.locator('#edit').click();
                await frame.locator('#source').fill(sample);
                await frame.locator('#test').click();
                const scframe=frame.locator('#player iframe');
                await scframe.waitFor({state:'visible',timeout:10000});
                const sf=await outer.elementHandle();const widgetHost=await sf.contentFrame();
                const nested=frame.frameLocator('#player iframe');
                let evidence={ready:false,playing:false,progressMs:0,positions:[],error:false,clicked:false};
                try{
                  await widgetHost.addScriptTag({url:'https://w.soundcloud.com/player/api.js'});
                  await widgetHost.evaluate(()=>{
                    window.qaSC={ready:false,playing:false,progressMs:0,positions:[],error:false};
                    const w=window.SC.Widget(document.querySelector('#player iframe'));window.qaWidget=w;
                    w.bind(window.SC.Widget.Events.READY,()=>{window.qaSC.ready=true;});
                    w.bind(window.SC.Widget.Events.PLAY,()=>{window.qaSC.playing=true;});
                    w.bind(window.SC.Widget.Events.PLAY_PROGRESS,p=>{window.qaSC.progressMs=Math.max(window.qaSC.progressMs,p.currentPosition||0);});
                    w.bind(window.SC.Widget.Events.ERROR,()=>{window.qaSC.error=true;});
                    w.getDuration(d=>{if(d>0)window.qaSC.ready=true;window.qaSC.duration=d;});
                  });
                  await widgetHost.waitForFunction(()=>window.qaSC.ready||window.qaSC.error,{},{timeout:15000});
                  // A real click on the provider's own control, not a parent-frame API play request.
                  const buttons=nested.locator('button[title*="Play"],button[aria-label*="Play"],button.playButton,[role="button"][aria-label*="Play"]');
                  const b=buttons.first();
                  await b.waitFor({state:'visible',timeout:12000});
                  await b.click({timeout:12000});
                  evidence.clicked=true;
                  for(let i=0;i<5;i++){
                    await page.waitForTimeout(1800);
                    await widgetHost.evaluate(()=>{window.qaWidget.getPosition(p=>window.qaSC.positions.push(p));});
                  }
                  await page.waitForTimeout(1000);
                }catch(e){evidence.blocker=String(e.message).split('\n')[0].slice(0,180);}
                const observed=await widgetHost.evaluate(()=>window.qaSC||{}).catch(()=>({}));
                evidence={...evidence,...observed};
                const advancing=evidence.progressMs>500||evidence.positions.some((p,i)=>i>0&&p-evidence.positions[0]>500);
                await widgetHost.evaluate(()=>window.qaWidget?.pause()).catch(()=>{});
                const providerLayout=await frame.locator('body').evaluate(()=>({h:innerHeight,w:innerWidth,scrollH:document.documentElement.scrollHeight,copyBottom:document.querySelector('#copy').getBoundingClientRect().bottom,playerTop:document.querySelector('#player iframe').getBoundingClientRect().top}));
                assert.ok(providerLayout.copyBottom<=providerLayout.h,'Provider copy button clipped');
                console.log(JSON.stringify({qaProvider:mobile?'mobile viewport':'desktop',provider:'SoundCloud official sample',...evidence,advancing,providerLayout,stayedOnForm:page.url()===original}));
                await context.close();
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
